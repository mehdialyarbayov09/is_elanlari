<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>İşguzar.az - Yeni Elan Yerləşdir</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-blue-600 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold">💼 İşguzar.az</h1>
        <a href="/" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold hover:bg-blue-50 transition">Ana Səhifə</a>
    </nav>

    <!-- Main Container -->
    <div class="max-w-2xl mx-auto p-6 mt-6 bg-white rounded-xl shadow-sm border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Yeni İş Elanı Yerləşdir</h2>

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-gray-700 font-medium mb-1">Vakansiya Başlığı</label>
                <input type="text" name="title" required placeholder="Məsələn: Python Developer" 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-1">Şirkət Adı</label>
                <input type="text" name="company" required placeholder="Məsələn: Tech MMC" 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-1">Şəhər / Məkan</label>
                <input type="text" name="location" required placeholder="Məsələn: Bakı" 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 font-medium mb-1">Kateqoriya</label>
                    <select name="category" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="İT və Proqramlaşdırma">İT və Proqramlaşdırma</option>
                        <option value="Marketinq və SMM">Marketinq və SMM</option>
                        <option value="Maliyyə və Mühasibatlıq">Maliyyə və Mühasibatlıq</option>
                        <option value="Satış və Müştəri Xidmətləri">Satış və Müştəri Xidmətləri</option>
                        <option value="Digər">Digər</option>
                    </select>
                </div>

                <div>
                    <label class="block text-gray-700 font-medium mb-1">İş Rejimi</label>
                    <select name="job_type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="Tamştat (Full-time)">Tamştat (Full-time)</option>
                        <option value="Yarımştat (Part-time)">Yarımştat (Part-time)</option>
                        <option value="Təcrübə proqramı">Təcrübə proqramı</option>
                        <option value="Uzaqdan (Remote)">Uzaqdan (Remote)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-1">İş Haqqında Məlumat</label>
                <textarea name="description" rows="4" required placeholder="İş tələbləri və öhdəliklər..." 
                          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-1">Əlaqə (E-poçt və ya nömrə)</label>
                <input type="text" name="contact" required placeholder="Məsələn: hr@company.az" 
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">Elanı Yerləşdir</button>
        </form>
    </div>
</body>
</html>
